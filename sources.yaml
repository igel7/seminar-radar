# ============================================================
# セミナー・レーダー 設定ファイル
# 巡回先の追加・削除はこのファイルを編集するだけでよい
# ============================================================

settings:
  # 注意: extraction_model / discovery_model は予備手段 scripts/update_api.py
  # (Anthropic API従量課金版)専用の設定であり、通常運用の日次更新を実行する
  # エージェント(Claude Code / Codex)には一切影響しない。
  # エージェントのモデル選択・サブエージェント委譲のルールは AGENTS.md の A-3 を参照。
  # 予備手段を実際に使う際は、モデルIDが現行のものか要確認。
  # ページ抽出に使うモデル(安価なモデルで十分)
  extraction_model: "claude-haiku-4-5"
  # ネット検索による新規発見に使うモデル
  discovery_model: "claude-sonnet-4-6"
  # 1ページから抽出するテキストの最大文字数
  max_page_chars: 30000
  # discovery(ネット検索)での最大検索回数/日
  max_searches_per_day: 12
  # 何日前より古い終了イベントをアーカイブに落とすか
  archive_after_days: 30

